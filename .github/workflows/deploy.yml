name: CI

on:
  push:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: pdo, mbstring, xml, curl, zip, bcmath, tokenizer, fileinfo

      - name: Install dependencies
        run: composer install --no-dev --optimize-autoloader --no-interaction

      - name: Check syntax
        run: php -r "echo 'PHP OK';"
