[phases.setup]
nixPkgs = [
    "php83",
    "php83Extensions.pdo",
    "php83Extensions.pdo_mysql",
    "php83Extensions.mbstring",
    "php83Extensions.xml",
    "php83Extensions.curl",
    "php83Extensions.zip",
    "php83Extensions.bcmath",
    "php83Extensions.tokenizer",
    "php83Extensions.fileinfo",
    "php83Extensions.gd",
    "php83Extensions.intl",
    "php83Extensions.pcntl",
    "bash",
    "coreutils",
]

[phases.install]
cmds = ["composer install --no-dev --optimize-autoloader --no-interaction"]

[phases.build]
cmds = [
    "php artisan route:cache",
    "php artisan view:cache",
]

[start]
cmd = "echo '>>> BOOTING APP' && php artisan migrate --force 2>&1 || true; (php artisan queue:work --queue=telegram --timeout=180 --tries=1 --sleep=3 2>&1 &); (while true; do php artisan reminders:send 2>&1; sleep 60; done &); echo '>>> launching server on port' \"${PORT:-8080}\" && exec php -S 0.0.0.0:${PORT:-8080} -t public"
